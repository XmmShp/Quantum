workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'

stages: [verify, package, publish]

variables:
  GIT_DEPTH: "0"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.cache/nuget/packages"

default:
  tags: [ubuntu]
  interruptible: true

.dotnet:
  image: mcr.microsoft.com/dotnet/sdk:10.0
  cache:
    key: dotnet-$CI_PROJECT_ID
    paths: [.cache/nuget/packages/]
    when: always

verify-dotnet:
  extends: .dotnet
  stage: verify
  script:
    - dotnet restore Quantum.Core.slnx -p:QuantumCoreOnly=true
    - dotnet build Quantum.Core.slnx -c Release -p:QuantumCoreOnly=true --no-restore
    - dotnet test Quantum.Core.slnx -c Release -p:QuantumCoreOnly=true --no-build --logger trx --results-directory TestResults
  artifacts:
    when: always
    paths: [TestResults/]
    expire_in: 14 days

verify-web:
  image: node:24-bookworm-slim
  stage: verify
  script:
    - npm ci --prefix Quantum.Sdk/typescript
    - npm test --prefix Quantum.Sdk/typescript
    - node --test Quantum.Sdk/scripts/compute-version.test.mjs
    - (cd Quantum/samples/Quantum.ExampleWebPlugin && npm ci && npm test)
    - node --test Quantum/quantum/tests/web-plugin-host.test.mjs
    - node --test Quantum.OfficialPlugins/scripts/test-codex-media.mjs

verify-publishing:
  image:
    name: python:3.12-alpine@sha256:92abd2ba1bdfb48b1e2ac224b582dd1558d0d4bb11c903b126b5bf9c448fd656
    pull_policy: if-not-present
  stage: verify
  script:
    - pip install --disable-pip-version-check cryptography==50.0.2
    - cd Quantum.OfficialPlugins
    - python -m unittest discover -s tests/publishing -p 'test_*.py'

package-plugins:
  extends: .dotnet
  stage: package
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends python3
  script:
    - bash ci/package-plugins.sh
  artifacts:
    paths: [artifacts/plugins/]
    expire_in: 14 days

publish-platform-image:
  image:
    name: docker:28.0.4
    pull_policy: if-not-present
  stage: publish
  interruptible: false
  resource_group: platform-image
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker build --pull --output type=image,oci-artifact=false -f Quantum.Platform/Dockerfile --label "org.opencontainers.image.source=$CI_PROJECT_URL" --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" -t "$CI_REGISTRY_IMAGE/platform:$CI_COMMIT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE/platform:$CI_COMMIT_SHA"
    - docker run --rm --entrypoint /bin/sh "$CI_REGISTRY_IMAGE/platform:$CI_COMMIT_SHA" -c 'test -z "$(find /app -maxdepth 1 -type f -name "appsettings*.json" -print)"'
    - image="$(docker image inspect --format '{{index .RepoDigests 0}}' "$CI_REGISTRY_IMAGE/platform:$CI_COMMIT_SHA")"
    - test -n "$image"
    - printf 'PLATFORM_IMAGE=%s\n' "$image" > platform-image.env
  artifacts:
    reports:
      dotenv: platform-image.env
    expire_in: 30 days

publish-sdk:
  extends: .dotnet
  stage: publish
  interruptible: false
  resource_group: sdk-release
  rules:
    - if: '$CI_COMMIT_TAG =~ /^sdk\/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$/'
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends curl ca-certificates xz-utils python3
    - bash ci/install-node.sh
  script:
    - bash ci/publish-sdk.sh
  artifacts:
    paths: [artifacts/sdk/]
    expire_in: 30 days

publish-cli:
  extends: .dotnet
  stage: publish
  interruptible: false
  resource_group: cli-release
  rules:
    - if: '$CI_COMMIT_TAG =~ /^cli-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$/'
  script:
    - test -n "$NUGET_API_KEY"
    - dotnet pack Quantum.Platform/src/Quantum.Platform.Cli/Quantum.Platform.Cli.csproj -c Release -p:Version="${CI_COMMIT_TAG#cli-v}" -o artifacts/cli
    - dotnet nuget push 'artifacts/cli/*.nupkg' --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

publish-plugin:
  extends: .dotnet
  stage: publish
  interruptible: false
  resource_group: plugin-release-$CI_COMMIT_TAG
  timeout: 30 minutes
  rules:
    - if: '$CI_COMMIT_TAG =~ /^(calendar|codex|ledger)-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$/'
  needs: [package-plugins]
  script:
    - bash ci/publish-plugin.sh
  artifacts:
    when: always
    paths: [publish-result.json]
    expire_in: 30 days

pages:
  extends: .dotnet
  stage: publish
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
  script:
    - dotnet tool install docfx --tool-path .tools
    - cd Quantum
    - ../.tools/docfx docfx.json
    - mv _site ../public
  artifacts:
    paths: [public/]

include:
  - local: ci/native.yml
