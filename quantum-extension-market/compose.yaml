services:
  market:
    build:
      context: ..
      dockerfile: quantum-extension-market/Dockerfile
    environment:
      ConnectionStrings__postgres: Host=postgres;Port=5432;Database=quantum_extension_market;Username=postgres;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      ExtensionMarket__Jwt__SigningKey: ${EXTENSION_MARKET_JWT_SIGNING_KEY:?set EXTENSION_MARKET_JWT_SIGNING_KEY}
      ExtensionMarket__Storage__BasePath: /app/Files
    ports:
      - "5080:8080"
    volumes:
      - market-files:/app/Files
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: quantum_extension_market
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quantum_extension_market"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  market-files:
  postgres-data:
