# These optional jobs require dedicated OS runners. They never block Linux CI.
desktop-windows:
  stage: package
  tags: [quantum-windows]
  interruptible: false
  rules:
    - if: '$CI_COMMIT_TAG =~ /^desktop-v[0-9]+\.[0-9]+\.[0-9]+$/'
      when: manual
      allow_failure: true
  script:
    - cd Quantum
    - dotnet workload install maui-windows --skip-manifest-update
    - dotnet tool restore
    - ./scripts/Build-DesktopRelease.ps1 -Version ($env:CI_COMMIT_TAG -replace '^desktop-v', '') -Channel win-x64
  artifacts:
    paths: [Quantum/artifacts/delivery/]
    expire_in: 30 days

desktop-macos:
  stage: package
  tags: [quantum-macos]
  interruptible: false
  rules:
    - if: '$CI_COMMIT_TAG =~ /^desktop-v[0-9]+\.[0-9]+\.[0-9]+$/'
      when: manual
      allow_failure: true
  parallel:
    matrix:
      - CHANNEL: [osx-arm64, osx-x64]
  script:
    - cd Quantum
    - dotnet workload install maui-maccatalyst --skip-manifest-update
    - dotnet tool restore
    - pwsh -NoProfile -Command '. ./scripts/Initialize-MacSigning.ps1; ./scripts/Build-DesktopRelease.ps1 -Version ($env:CI_COMMIT_TAG -replace "^desktop-v", "") -Channel $env:CHANNEL'
  after_script:
    - security delete-keychain "$CI_PROJECT_DIR/.quantum-signing.keychain-db" || true
  artifacts:
    paths: [Quantum/artifacts/delivery/]
    expire_in: 30 days

mobile-windows:
  stage: package
  tags: [quantum-windows]
  interruptible: false
  rules:
    - if: '$CI_COMMIT_TAG =~ /^mobile-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$/'
      when: manual
      allow_failure: true
  script:
    - cd Quantum
    - dotnet workload install maui-windows --skip-manifest-update
    - ./scripts/Build-MobileRelease.ps1 -Version (($env:CI_COMMIT_TAG -replace '^mobile-v', '') -replace '-.*$', '') -Target win-x64 -BuildNumber $env:CI_PIPELINE_IID
  artifacts:
    paths: [Quantum/artifacts/mobile-delivery/]
    expire_in: 30 days

mobile-android:
  extends: .dotnet
  image: $QUANTUM_ANDROID_IMAGE
  tags: [quantum-android]
  stage: package
  interruptible: false
  rules:
    - if: '$CI_COMMIT_TAG =~ /^mobile-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$/'
      when: manual
      allow_failure: true
  script:
    - bash ci/package-android.sh
  artifacts:
    paths: [Quantum/artifacts/mobile-delivery/]
    expire_in: 30 days
