name: Build and publish

on:
  pull_request:
  push:
    branches: [main]
    tags:
      - "calendar-v*"
      - "codex-v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore Quantum.OfficialPlugins.slnx
      - run: dotnet build Quantum.OfficialPlugins.slnx -c Release --no-restore --verbosity minimal
      - run: dotnet test tests/Quantum.OfficialPlugins.Tests/Quantum.OfficialPlugins.Tests.csproj -c Release --no-build --verbosity quiet

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: official-plugin-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Select and validate plugin
        id: plugin
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            calendar-v*) directory="Calendar"; expected_id="quantum.plugin.calendar"; tag_version="${GITHUB_REF_NAME#calendar-v}" ;;
            codex-v*) directory="Codex"; expected_id="quantum.plugin.codex"; tag_version="${GITHUB_REF_NAME#codex-v}" ;;
            *) echo "Unsupported release tag: $GITHUB_REF_NAME" >&2; exit 1 ;;
          esac
          manifest_id="$(jq -r '.id' "$directory/plugin.json")"
          manifest_version="$(jq -r '.version' "$directory/plugin.json")"
          test "$manifest_id" = "$expected_id"
          test "$manifest_version" = "$tag_version"
          echo "directory=$directory" >> "$GITHUB_OUTPUT"
          echo "version=$manifest_version" >> "$GITHUB_OUTPUT"
      - name: Build release payload
        run: dotnet build "${{ steps.plugin.outputs.directory }}/Quantum.${{ steps.plugin.outputs.directory }}Plugin.csproj" -c Release --verbosity minimal
      - name: Check publishing credentials
        env:
          QUANTUM_CLIENT_ID: ${{ secrets.QUANTUM_CLIENT_ID }}
          QUANTUM_CLIENT_PRIVATE_JWKS: ${{ secrets.QUANTUM_CLIENT_PRIVATE_JWKS }}
        run: |
          test -n "$QUANTUM_CLIENT_ID" || { echo "::error::Missing QUANTUM_CLIENT_ID Actions secret"; exit 1; }
          test -n "$QUANTUM_CLIENT_PRIVATE_JWKS" || { echo "::error::Missing QUANTUM_CLIENT_PRIVATE_JWKS Actions secret"; exit 1; }
      - name: Install Quantum Platform CLI
        run: dotnet tool install --global Quantum.Platform.Cli --version 0.1.1
      - name: Publish and wait for automated review
        env:
          QUANTUM_CLIENT_ID: ${{ secrets.QUANTUM_CLIENT_ID }}
          QUANTUM_CLIENT_PRIVATE_JWKS: ${{ secrets.QUANTUM_CLIENT_PRIVATE_JWKS }}
        run: |
          set -euo pipefail
          quantum-cli plugins publish \
            "${{ steps.plugin.outputs.directory }}/bin/Release/net10.0" \
            --quantum-version-support ">=0.1.0" \
            --release-notes "Official release $GITHUB_REF_NAME" \
            --wait-seconds 900 \
            --output subprocess | tee publish-result.json
          jq -e '.ok == true and .status == "Published"' publish-result.json
          {
            echo '### Quantum plugin published'
            jq -r '"Plugin: `\(.pluginId)@\(.version)`\n\nStatus: \(.status)\n\nSHA-256: `\(.sha256)`"' publish-result.json
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: publish-result-${{ github.ref_name }}
          path: publish-result.json
