name: Release Mobile

on:
  push:
    tags: ['mobile-v*']
  workflow_dispatch:
    inputs:
      version:
        description: Mobile X.Y.Z version; builds artifacts only
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        shell: bash
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          value="${REQUESTED:-${GITHUB_REF_NAME#mobile-v}}"
          [[ "$value" =~ ^([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.-]+)?$ ]]
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

  android:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      MOBILE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MOBILE_ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android workload and dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet workload install android --skip-manifest-update
          dotnet build mobile/Quantum.Mobile/Quantum.Mobile.csproj -f net10.0-android -t:InstallAndroidDependencies -p:AcceptAndroidSdkLicenses=true -p:AndroidSdkDirectory=$env:ANDROID_HOME
      - name: Prepare signing key
        shell: pwsh
        env:
          KEYSTORE: ${{ secrets.MOBILE_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if (!$env:KEYSTORE -or !$env:MOBILE_ANDROID_KEYSTORE_PASSWORD) { throw 'Persistent Android signing credentials are required.' }
          $path = Join-Path $env:RUNNER_TEMP 'quantum-mobile.p12'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:KEYSTORE))
          "MOBILE_ANDROID_KEYSTORE_PATH=$path" >> $env:GITHUB_ENV
      - name: Publish signed APK
        shell: pwsh
        run: ./scripts/Build-MobileRelease.ps1 -Version '${{ needs.prepare.outputs.version }}' -Target android -BuildNumber ${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-android
          path: artifacts/mobile-delivery/android/*
          if-no-files-found: error
      - name: Remove signing key from runner
        if: always()
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'quantum-mobile.p12'
          if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path }

  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install MAUI workload
        run: dotnet workload install maui-windows --skip-manifest-update
      - name: Test transport and host
        run: dotnet test quantum/tests/Quantum.Tests/Quantum.Tests.csproj -c Release -f net10.0 -p:TargetFrameworks=net10.0
      - name: Publish portable Windows client
        shell: pwsh
        run: ./scripts/Build-MobileRelease.ps1 -Version '${{ needs.prepare.outputs.version }}' -Target win-x64 -BuildNumber ${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-windows
          path: artifacts/mobile-delivery/win-x64/*
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: [prepare, android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: mobile-*
          merge-multiple: true
          path: artifacts/mobile-release
      - name: Publish development preview
        run: gh release create "$GITHUB_REF_NAME" artifacts/mobile-release/* --verify-tag --prerelease --title "Quantum Mobile ${{ needs.prepare.outputs.version }} Preview" --notes-file docs/mobile-release-notes.md
