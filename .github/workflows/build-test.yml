name: Build Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"
  CONFIGURATION: "Release"

jobs:
  build-test:
    name: Windows MAUI build and tests
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install MAUI workload
        run: dotnet workload install maui --skip-manifest-update

      - name: Restore
        run: dotnet restore Quantum.slnx

      - name: Build
        run: dotnet build Quantum.slnx -c ${{ env.CONFIGURATION }} --no-restore

      - name: Test
        run: dotnet test quantum/tests/Quantum.Tests/Quantum.Tests.csproj -c ${{ env.CONFIGURATION }} --no-build

      - name: Test extension market
        run: dotnet test quantum-extension-market/tests/Quantum.ExtensionMarket.Tests/Quantum.ExtensionMarket.Tests.csproj -c ${{ env.CONFIGURATION }} --no-build
