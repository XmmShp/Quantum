name: Build Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"
  CONFIGURATION: "Release"

jobs:
  build-test:
    name: Windows MAUI build and tests
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Quantum

    steps:
      - uses: actions/checkout@v4
        with:
          path: Quantum

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Quantum/samples/Quantum.ExampleWebPlugin/package-lock.json

      - name: Build and test example Web plugin
        run: npm ci --prefix samples/Quantum.ExampleWebPlugin && npm test --prefix samples/Quantum.ExampleWebPlugin

      - name: Test Web plugin host protocol
        run: node --test quantum/tests/web-plugin-host.test.mjs

      - name: Install MAUI workload
        run: dotnet workload install maui --skip-manifest-update

      - name: Restore
        run: dotnet restore Quantum.slnx

      - name: Build
        run: dotnet build Quantum.slnx -c ${{ env.CONFIGURATION }} --no-restore

      - name: Test
        run: dotnet test quantum/tests/Quantum.Tests/Quantum.Tests.csproj -c ${{ env.CONFIGURATION }} --no-build
