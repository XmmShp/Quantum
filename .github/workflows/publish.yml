name: Publish Releases

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (for example 2.0.0)"
        required: true
        type: string

env:
  DOTNET_VERSION: "10.0.x"
  CONFIGURATION: "Release"

jobs:
  publish:
    name: Publish ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - name: Windows-x64
            runner: windows-latest
            framework: net10.0-windows10.0.19041.0
            runtime: win-x64
          - name: macOS-arm64
            runner: macos-latest
            framework: net10.0-maccatalyst
            runtime: maccatalyst-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install MAUI workload
        run: dotnet workload install maui --skip-manifest-update

      - name: Publish host
        run: >-
          dotnet publish quantum/src/Quantum.Host/Quantum.Host.csproj
          -c ${{ env.CONFIGURATION }}
          -f ${{ matrix.framework }}
          -r ${{ matrix.runtime }}
          -p:ApplicationDisplayVersion=${{ inputs.version }}
          -p:WindowsPackageType=None
          -o artifacts/${{ matrix.name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quantum-${{ inputs.version }}-${{ matrix.name }}
          path: artifacts/${{ matrix.name }}

  create-release:
    name: Create draft release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Archive artifacts
        run: |
          for directory in artifacts/*; do
            tar -czf "${directory}.tar.gz" -C "$directory" .
          done

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Quantum ${{ inputs.version }}
          draft: true
          prerelease: false
          files: artifacts/*.tar.gz
