name: Release

on:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: quantum-platform-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    env:
      DOTNET_VERSION: "10.0.x"
      CONFIGURATION: Release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore Quantum.Platform.slnx --verbosity quiet
      - run: dotnet build Quantum.Platform.slnx -c ${{ env.CONFIGURATION }} --no-restore --verbosity quiet
      - run: dotnet test tests/Quantum.Platform.Tests/Quantum.Platform.Tests.csproj -c ${{ env.CONFIGURATION }} --no-build --verbosity quiet

  publish:
    name: Publish
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/xmmshp/quantum-platform:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    needs: publish
    runs-on: [self-hosted, Linux, X64, quantum-platform-prod]
    permissions:
      contents: read
      packages: read
    environment:
      name: production
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy
        env:
          QUANTUM_PLATFORM_IMAGE: ghcr.io/xmmshp/quantum-platform:${{ github.sha }}
          QUANTUM_PLATFORM_DEPLOYMENT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: bash scripts/deploy-production.sh
      - name: Verify
        env:
          QUANTUM_PLATFORM_IMAGE: ghcr.io/xmmshp/quantum-platform:${{ github.sha }}
        run: bash scripts/verify-production.sh
