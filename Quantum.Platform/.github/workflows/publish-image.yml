name: Publish image

on:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: quantum-platform-image
  cancel-in-progress: false

env:
  QuantumMobileInternalProject: ${{ github.workspace }}/.framework/Quantum/quantum/src/Quantum.Mobile.Internal/Quantum.Mobile.Internal.csproj

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    env:
      DOTNET_VERSION: "10.0.x"
      CONFIGURATION: Release
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned framework revision
        id: framework
        run: echo "sha=$(cat .framework/quantum.ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: XmmShp/Quantum
          ref: ${{ steps.framework.outputs.sha }}
          path: .framework/Quantum
          sparse-checkout: quantum/src/Quantum.Mobile.Internal
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore Quantum.Platform.slnx --verbosity quiet
      - run: dotnet build Quantum.Platform.slnx -c ${{ env.CONFIGURATION }} --no-restore --verbosity quiet
      - run: dotnet test tests/Quantum.Platform.Tests/Quantum.Platform.Tests.csproj -c ${{ env.CONFIGURATION }} --no-build --verbosity quiet

  publish:
    name: Publish
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned framework revision
        id: framework
        run: echo "sha=$(cat .framework/quantum.ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: XmmShp/Quantum
          ref: ${{ steps.framework.outputs.sha }}
          path: .framework/Quantum
          sparse-checkout: quantum/src/Quantum.Mobile.Internal
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          build-contexts: |
            quantum-framework=./.framework/Quantum
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ghcr.io/xmmshp/quantum-platform:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify clean runtime artifact
        env:
          IMAGE: ghcr.io/xmmshp/quantum-platform@${{ steps.image.outputs.digest }}
        run: |
          docker pull "$IMAGE"
          docker run --rm --entrypoint /bin/sh "$IMAGE" -c 'test -z "$(find /app -maxdepth 1 -type f -name "appsettings*.json" -print)"'
      - name: Record immutable artifact
        env:
          IMAGE: ghcr.io/xmmshp/quantum-platform@${{ steps.image.outputs.digest }}
        run: |
          printf 'Image: `%s`\nCommit: `%s`\n' "$IMAGE" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
