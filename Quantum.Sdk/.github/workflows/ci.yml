name: Build and test

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: dotnet test Quantum.Sdk.slnx --configuration Release
      - run: npm ci
        working-directory: typescript
      - run: npm test
        working-directory: typescript
      - run: node --test scripts/compute-version.test.mjs
